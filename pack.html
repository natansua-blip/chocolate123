<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบหยิบสินค้า & ใบปะหน้าพัสดุ</title>
<style>
body{font:15px/1.5 sans-serif;margin:16px;color:#222}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,button{font:inherit;padding:8px}
table{border-collapse:collapse;margin-bottom:24px}td,th{border:1px solid #999;padding:6px 12px;text-align:left}
.label{border:2px solid #000;padding:12px;margin:0 0 12px;width:380px;break-inside:avoid}
.label h4{margin:0 0 6px}.to{font-size:18px}
.labels{display:flex;flex-wrap:wrap;gap:12px}
@media print{.bar,.pick{display:none}}
</style></head><body>
<div class="bar"><input id="key" type="password" placeholder="รหัสแอดมิน">
<button onclick="go()">โหลดออเดอร์ใหม่</button><button onclick="print()">พิมพ์ใบปะหน้า</button></div>
<div class="pick"><h2>ใบหยิบสินค้า (ออเดอร์สถานะ new)</h2><table id="pick"></table></div>
<h2>ใบปะหน้าพัสดุ</h2><div class="labels" id="labels"></div>
<script>
const API="https://script.google.com/macros/s/AKfycbxlY_dF9O89SNmdAUuQSs4so7BLr0ipjvAOUb1oBtco_79V7HuKJDDQqnZxQS_oepCpAA/exec"; // URL เดียวกับ index.html
async function go(){
  const r=await fetch(`${API}?action=orders&key=${encodeURIComponent(key.value)}`);
  const rows=(await r.json()).filter(o=>o.status==="new");
  const sum={}; rows.forEach(o=>{const k=o.sku+"|"+o.product;sum[k]=(sum[k]||0)+Number(o.qty)});
  pick.innerHTML="<tr><th>SKU</th><th>สินค้า</th><th>จำนวนที่ต้องหยิบ</th></tr>"+
   Object.entries(sum).map(([k,q])=>{const[s,p]=k.split("|");return`<tr><td>${s}</td><td>${p}</td><td>${q}</td></tr>`}).join("");
  const by={}; rows.forEach(o=>(by[o.order_id]??=[]).push(o));
  labels.innerHTML=Object.entries(by).map(([id,L])=>{const o=L[0];return`<div class="label">
   <h4>ออเดอร์ ${id}</h4><div class="to"><b>ผู้รับ:</b> ${o.name} โทร ${o.phone}<br>${o.address} ${o.zip}</div>
   <hr>${L.map(l=>`${l.sku} × ${l.qty}`).join("<br>")}<br><b>ยอดรวม ${o.total} บาท</b></div>`}).join("");
}
</script></body></html>
